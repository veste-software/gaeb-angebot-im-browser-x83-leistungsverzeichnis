<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Schritt 1: Eine Seite Leistungsverzeichnis fällt in das grüne Ablagefeld.">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2.4" height="8" fill="#22302A"/>
    </pattern>
  </defs>

  <!-- The drop zone: a green field with a perforated border and its own sprocket margin -->
  <rect x="50" y="196" width="380" height="124" fill="#DDEBD7" stroke="#22302A" stroke-width="3" stroke-dasharray="10 6"/>
  <line x1="88" y1="199" x2="88" y2="317" stroke="#22302A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g fill="#22302A">
    <circle cx="69" cy="222" r="5"/><circle cx="69" cy="258" r="5"/><circle cx="69" cy="294" r="5"/>
    <rect x="104" y="290" width="24" height="5"/><rect x="146" y="290" width="64" height="5"/>
    <rect x="330" y="290" width="28" height="5"/><rect x="378" y="290" width="28" height="5"/>
  </g>
  <line x1="104" y1="304" x2="414" y2="304" stroke="#22302A" stroke-width="1.5"/>

  <!-- The X83 page on its way in -->
  <g transform="rotate(-6 240 140)">
    <rect x="172" y="46" width="180" height="210" fill="url(#hatch)"/>
    <rect x="160" y="34" width="180" height="210" fill="#F4F6EE" stroke="#22302A" stroke-width="3"/>
    <line x1="186" y1="36" x2="186" y2="242" stroke="#22302A" stroke-width="1.5" stroke-dasharray="5 5"/>
    <g fill="#22302A">
      <circle cx="173" cy="56" r="4.5"/><circle cx="173" cy="88" r="4.5"/><circle cx="173" cy="120" r="4.5"/>
      <circle cx="173" cy="152" r="4.5"/><circle cx="173" cy="184" r="4.5"/><circle cx="173" cy="216" r="4.5"/>
    </g>
    <g fill="#22302A">
      <rect x="196" y="50" width="18" height="5"/><rect x="226" y="50" width="44" height="5"/><rect x="304" y="50" width="26" height="5"/>
    </g>
    <line x1="186" y1="64" x2="338" y2="64" stroke="#22302A" stroke-width="1.5"/>
    <rect x="186" y="70" width="152" height="72" fill="#DDEBD7"/>
    <g fill="#22302A">
      <rect x="196" y="80" width="20" height="5"/><rect x="226" y="80" width="58" height="5"/>
      <rect x="196" y="104" width="20" height="5"/><rect x="226" y="104" width="42" height="5"/>
      <rect x="196" y="128" width="20" height="5"/><rect x="226" y="128" width="52" height="5"/>
      <rect x="196" y="152" width="20" height="5"/><rect x="226" y="152" width="36" height="5"/>
      <rect x="196" y="176" width="20" height="5"/><rect x="226" y="176" width="56" height="5"/>
      <rect x="196" y="200" width="20" height="5"/><rect x="226" y="200" width="46" height="5"/>
    </g>
    <g stroke="#22302A" stroke-width="1.5" stroke-dasharray="2 4">
      <line x1="300" y1="88" x2="332" y2="88"/><line x1="300" y1="112" x2="332" y2="112"/>
      <line x1="300" y1="136" x2="332" y2="136"/><line x1="300" y1="160" x2="332" y2="160"/>
      <line x1="300" y1="184" x2="332" y2="184"/><line x1="300" y1="208" x2="332" y2="208"/>
    </g>
  </g>

  <!-- The move, in the colour of everything the visitor does -->
  <rect x="395" y="64" width="10" height="74" fill="#1B3E9C"/>
  <polygon points="381,134 419,134 400,162" fill="#1B3E9C"/>
</svg>
