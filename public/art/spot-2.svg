<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Schritt 2: Einheitspreise mit blauem Kugelschreiber auf die gepunktete Linie schreiben; eine fehlende Position ist rot angestrichen.">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2.4" height="8" fill="#22302A"/>
    </pattern>
  </defs>

  <rect x="52" y="48" width="400" height="290" fill="url(#hatch)"/>
  <rect x="40" y="36" width="400" height="290" fill="#F4F6EE" stroke="#22302A" stroke-width="3"/>
  <line x1="72" y1="38" x2="72" y2="324" stroke="#22302A" stroke-width="1.5" stroke-dasharray="5 5"/>
  <g fill="#22302A">
    <circle cx="56" cy="66" r="5"/><circle cx="56" cy="106" r="5"/><circle cx="56" cy="146" r="5"/>
    <circle cx="56" cy="186" r="5"/><circle cx="56" cy="226" r="5"/><circle cx="56" cy="266" r="5"/><circle cx="56" cy="306" r="5"/>
    <rect x="86" y="54" width="24" height="6"/><rect x="126" y="54" width="70" height="6"/>
    <rect x="252" y="54" width="28" height="6"/><rect x="380" y="54" width="28" height="6"/>
  </g>
  <line x1="72" y1="74" x2="438" y2="74" stroke="#22302A" stroke-width="1.5"/>
  <rect x="72" y="80" width="366" height="132" fill="#DDEBD7"/>

  <!-- Typed by the tender: OZ, short text; computed: GP -->
  <g fill="#22302A">
    <rect x="86" y="98" width="26" height="7"/><rect x="126" y="98" width="96" height="7"/><rect x="356" y="98" width="66" height="7"/>
    <rect x="86" y="142" width="26" height="7"/><rect x="126" y="142" width="72" height="7"/><rect x="362" y="142" width="60" height="7"/>
    <rect x="86" y="186" width="26" height="7"/><rect x="126" y="186" width="104" height="7"/><rect x="372" y="186" width="50" height="7"/>
    <rect x="86" y="230" width="26" height="7"/><rect x="126" y="230" width="84" height="7"/>
    <rect x="86" y="274" width="26" height="7"/><rect x="126" y="274" width="118" height="7"/>
  </g>
  <!-- Fill-in lines still open -->
  <g stroke="#22302A" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="250" y1="246" x2="318" y2="246"/>
    <line x1="250" y1="290" x2="318" y2="290"/>
    <line x1="356" y1="290" x2="422" y2="290"/>
  </g>
  <!-- Written by the bidder, in ballpoint blue -->
  <g fill="none" stroke="#1B3E9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 104q5-11 10 0t10 0M276 108l2 5M284 104q5-11 10 0t10 0"/>
    <path d="M252 148q5-11 10 0t10 0t10 0M286 152l2 5M294 148q5-11 10 0t10 0"/>
    <path d="M252 192q5-11 10 0M266 196l2 5M274 192q5-11 10 0t10 0"/>
    <path d="M252 236q5-11 10 0t10 0"/>
  </g>
  <!-- Missing price: the red correction pencil under the OZ -->
  <line x1="83" y1="288" x2="115" y2="290" stroke="#B3261E" stroke-width="3" stroke-linecap="round"/>

  <!-- The ballpoint, mid-figure -->
  <g transform="translate(283 250) rotate(-50)">
    <polygon points="0,0 32,-11 222,-11 222,11 32,11" fill="url(#hatch)"/>
  </g>
  <g transform="translate(273 236) rotate(-50)">
    <polygon points="0,0 10,-3 10,3" fill="#22302A"/>
    <polygon points="10,-4 32,-11 32,11 10,4" fill="#F4F6EE" stroke="#22302A" stroke-width="3"/>
    <rect x="32" y="-11" width="52" height="22" fill="#22302A"/>
    <g fill="#DDEBD7"><rect x="42" y="-11" width="3" height="22"/><rect x="52" y="-11" width="3" height="22"/><rect x="62" y="-11" width="3" height="22"/></g>
    <rect x="84" y="-11" width="90" height="22" fill="#1B3E9C" stroke="#22302A" stroke-width="3"/>
    <rect x="94" y="-5" width="70" height="3" fill="#F4F6EE"/>
    <rect x="174" y="-11" width="38" height="22" fill="#22302A"/>
    <rect x="212" y="-6" width="10" height="12" fill="#22302A"/>
    <rect x="160" y="-20" width="56" height="8" fill="#22302A"/>
  </g>
</svg>
