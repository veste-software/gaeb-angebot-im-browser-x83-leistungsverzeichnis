<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Noch kein Leistungsverzeichnis: ein leeres Blatt Endlospapier und ein Kugelschreiber liegen bereit.">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2.4" height="8" fill="#22302A"/>
    </pattern>
  </defs>

  <line x1="40" y1="318" x2="440" y2="318" stroke="#22302A" stroke-width="3"/>

  <!-- Fan-fold stack -->
  <g stroke="#22302A" stroke-width="3">
    <rect x="110" y="306" width="270" height="12" fill="#DDEBD7"/>
    <rect x="98" y="294" width="270" height="12" fill="#F4F6EE"/>
    <rect x="110" y="282" width="270" height="12" fill="#DDEBD7"/>
  </g>

  <!-- A blank page: column heads, green bars, empty fill-in lines -->
  <rect x="162" y="62" width="190" height="220" fill="url(#hatch)"/>
  <rect x="150" y="50" width="190" height="232" fill="#F4F6EE" stroke="#22302A" stroke-width="3"/>
  <g stroke="#22302A" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="176" y1="52" x2="176" y2="280"/><line x1="314" y1="52" x2="314" y2="280"/>
  </g>
  <g fill="#22302A">
    <circle cx="163" cy="72" r="4.5"/><circle cx="163" cy="104" r="4.5"/><circle cx="163" cy="136" r="4.5"/><circle cx="163" cy="168" r="4.5"/>
    <circle cx="163" cy="200" r="4.5"/><circle cx="163" cy="232" r="4.5"/><circle cx="163" cy="264" r="4.5"/>
    <circle cx="327" cy="72" r="4.5"/><circle cx="327" cy="104" r="4.5"/><circle cx="327" cy="136" r="4.5"/><circle cx="327" cy="168" r="4.5"/>
    <circle cx="327" cy="200" r="4.5"/><circle cx="327" cy="232" r="4.5"/><circle cx="327" cy="264" r="4.5"/>
    <rect x="184" y="68" width="14" height="5"/><rect x="206" y="68" width="38" height="5"/>
    <rect x="262" y="68" width="18" height="5"/><rect x="290" y="68" width="18" height="5"/>
  </g>
  <line x1="176" y1="84" x2="314" y2="84" stroke="#22302A" stroke-width="1.5"/>
  <rect x="176" y="90" width="138" height="66" fill="#DDEBD7"/>
  <rect x="176" y="222" width="138" height="44" fill="#DDEBD7"/>
  <g stroke="#22302A" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="258" y1="106" x2="282" y2="106"/><line x1="258" y1="128" x2="282" y2="128"/><line x1="258" y1="150" x2="282" y2="150"/>
    <line x1="258" y1="172" x2="282" y2="172"/><line x1="258" y1="194" x2="282" y2="194"/><line x1="258" y1="216" x2="282" y2="216"/>
    <line x1="258" y1="238" x2="282" y2="238"/><line x1="258" y1="260" x2="282" y2="260"/>
  </g>

  <!-- The ballpoint, lying ready in front of the stack -->
  <g transform="translate(262 307) scale(.85)">
    <polygon points="0,0 10,-3 10,3" fill="#22302A"/>
    <polygon points="10,-4 32,-11 32,11 10,4" fill="#F4F6EE" stroke="#22302A" stroke-width="3.5"/>
    <rect x="32" y="-11" width="52" height="22" fill="#22302A"/>
    <g fill="#DDEBD7"><rect x="42" y="-11" width="3" height="22"/><rect x="52" y="-11" width="3" height="22"/><rect x="62" y="-11" width="3" height="22"/></g>
    <rect x="84" y="-11" width="90" height="22" fill="#1B3E9C" stroke="#22302A" stroke-width="3.5"/>
    <rect x="94" y="-5" width="70" height="3" fill="#F4F6EE"/>
    <rect x="174" y="-11" width="38" height="22" fill="#22302A"/>
    <rect x="212" y="-6" width="10" height="12" fill="#22302A"/>
    <rect x="160" y="-20" width="56" height="8" fill="#22302A"/>
  </g>
</svg>
